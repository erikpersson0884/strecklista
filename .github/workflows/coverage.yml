name: Test Coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Calculate coverage
        id: coverage
        run: |
          LF=$(grep '^LF:' coverage/lcov.info | awk -F: '{sum += $2} END {print sum}')
          LH=$(grep '^LH:' coverage/lcov.info | awk -F: '{sum += $2} END {print sum}')

          if [ "$LF" -eq 0 ]; then
            COVERAGE=0
          else
            COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($LH / $LF) * 100}")
          fi

          echo "Coverage: $COVERAGE%"
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Generate coverage badge
        run: |
          COVERAGE="${{ steps.coverage.outputs.percentage }}"

          cat > .github/coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="120" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="a">
              <rect width="120" height="20" rx="3"/>
            </clipPath>
            <g clip-path="url(#a)">
              <rect width="70" height="20" fill="#555"/>
              <rect x="70" width="50" height="20" fill="#4c1"/>
              <rect width="120" height="20" fill="url(#b)"/>
            </g>
            <g fill="#fff" text-anchor="middle"
               font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
               font-size="11">
              <text x="35" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="35" y="14">coverage</text>
              <text x="95" y="15" fill="#010101" fill-opacity=".3">${COVERAGE}%</text>
              <text x="95" y="14">${COVERAGE}%</text>
            </g>
          </svg>
          EOF

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .github/coverage.svg

            git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
            git push