name: Test Coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Calculate coverage
        id: coverage
        run: |
          LF=$(grep '^LF:' coverage/lcov.info | awk -F: '{sum += $2} END {print sum}')
          LH=$(grep '^LH:' coverage/lcov.info | awk -F: '{sum += $2} END {print sum}')

          if [ -z "$LF" ] || [ "$LF" -eq 0 ]; then
            COVERAGE=0
          else
            COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($LH / $LF) * 100}")
          fi

          echo "Coverage: $COVERAGE%"
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Generate coverage data
        run: |
          COVERAGE="${{ steps.coverage.outputs.percentage }}"

          if awk "BEGIN {exit !($COVERAGE >= 80)}"; then COLOR=brightgreen
          elif awk "BEGIN {exit !($COVERAGE >= 60)}"; then COLOR=yellow
          else COLOR=red
          fi

          cat > /tmp/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "${COLOR}"
          }
          EOF

      - name: Update coverage branch
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin coverage || true

          if git show-ref --verify --quiet refs/remotes/origin/coverage; then
            git checkout -B coverage origin/coverage --
          else
            git checkout --orphan coverage --
            git rm -rf .
          fi

          mkdir -p .github
          cp /tmp/coverage.json .github/coverage.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/coverage.json

          if git diff --cached --quiet; then
            echo "Coverage badge has not changed"
          else
            git commit -m "chore: update coverage data"
            git push origin HEAD:refs/heads/coverage
          fi